version: 2

updates:
  # Ruby gems. Jekyll and the Chirpy theme move slowly, so weekly is plenty.
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    # The theme is pinned to 7.0.x in the Gemfile: 7.1+ requires Ruby ~> 3.1,
    # which local development cannot run. Without this, Dependabot proposes the
    # bump again every week and merging it silently breaks local preview.
    ignore:
      - dependency-name: jekyll-theme-chirpy
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    # Matches the Conventional Commits rule the repo follows: chore(deps): ...
    commit-message:
      prefix: chore
      include: scope
    # One PR for all routine minor/patch bumps instead of five. Majors still
    # arrive individually, since those are the ones worth reading closely.
    groups:
      ruby-minor-and-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  # Workflow actions. Catches the next Node runtime deprecation before it
  # becomes an annotation on every run.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch
