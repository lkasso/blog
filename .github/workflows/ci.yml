name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and link check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Same command and environment the Pages workflow deploys with, so a PR
      # that builds here is a PR that will deploy.
      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # Internal links and images only. External URLs are deliberately not
      # checked: they fail when someone else's site is down, which would make
      # this gate flaky and train us to ignore it.
      - name: Check links and images
        run: |
          bundle exec htmlproofer ./_site \
            --disable-external \
            --allow-hash-href \
            --ignore-empty-alt \
            --no-enforce-https
