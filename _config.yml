# Laura Kassovic personal blog
# Built with Jekyll + Chirpy

lang: en
timezone: America/Los_Angeles

title: Laura Kassovic
tagline: Electrical engineer turned writer and advocate.
description: >-
  Writing about Gradle, build systems, open source in enterprise, developer experience,
  and AI-assisted software workflows.

url: "https://laura.kassovic.com"
baseurl: ""

github:
  username: lkasso

social:
  name: Laura Kassovic
  email: laura@kassovic.com
  links:
    - https://github.com/lkasso
    - https://x.com/oss_enterprise
    - https://bsky.app/profile/oss_enterprise.bsky.social
    - https://www.linkedin.com/in/laurakassovic/

# Theme
theme: jekyll-theme-chirpy

# Avatar. JPEG, not PNG: it is a photograph, and the PNG of the same 512x512
# crop was 318KB against 35KB here, on an asset that loads on every page.
avatar: /assets/img/avatar.jpg

# Social preview image (optional)
social_preview_image: /assets/img/social-preview.png

# Comments (disabled)
comments:
  provider:

# Analytics (disabled for now)
analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# Pagination
paginate: 10

# Theme mode: light | dark | (blank = system)
theme_mode:

# Plugins (no remote theme!)
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-archives

# Required for Chirpy archives
jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

# Required by Chirpy: without this, nothing in _tabs is ever output and the
# sidebar renders with no navigation links.
collections:
  tabs:
    output: true
    sort_by: order

# Defaults (recommended for posts)
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# Exclude dev files
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - .sass-cache